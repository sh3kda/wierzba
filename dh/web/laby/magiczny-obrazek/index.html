<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linki w zdjeciach</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #e8ecf3;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <h1> Link w zdjeciu</h1>
    <map name="image-map">
        <area shape="rect" coords="0,0,200,200" href="https://www.uj.edu.pl" alt="Opis obrazka">
        <area shape="rect" coords="201,0,400,200" href="https://studia.uj.edu.pl/kierunki/wziks/elektr.prze.info" alt="Opis obrazka 2">
    </map>
    <img src="obraz.jpg" usemap="#image-map" alt="Obrazek z mapą">
</body>
</html>
