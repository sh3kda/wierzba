<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plac zabaw JavaScript</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <main class="playground">
        <h1 id="duzy-tekst">Plac zabaw JS</h1>

        <section class="panel" data-hint="Sekcja zmiany wygladu: tlo i naglowek.">
            <h2>Zmiana wygladu</h2>
            <div class="actions">
                <button id="btn-zwieksz" type="button">Powieksz naglowek</button>
                <button id="btn-zmniejsz" type="button">Zmniejsz naglowek</button>
                <button id="btn-akcent" type="button">Ustaw ciemniejsze tlo</button>
                <button id="btn-neon" type="button">Wlacz tryb neonowy</button>
                <button id="btn-przywroc" type="button">Przywroc domyslne tlo</button>
                <button id="btn-tytul" type="button">Zmien tytul karty przegladarki</button>
            </div>
        </section>

        <section class="panel" data-hint="Sekcja akcji: alert, konsola i data.">
            <h2>Akcje i informacje</h2>
            <div class="actions">
                <button id="btn-alert" type="button">Pokaz alert</button>
                <button id="btn-konsola" type="button">Wyslij komunikat do konsoli</button>
                <button id="btn-data" type="button">Pokaz dzisiejsza date</button>
            </div>
            <p>Dzisiejsza data: <strong id="dzisiejsza-data">--</strong></p>
        </section>

        <p id="podpowiedz" class="hint">Najedz na sekcje, aby zobaczyc podpowiedz.</p>
        <p id="status-akcji" class="status">Gotowe do testow.</p>
    </main>
</body>
</html>
