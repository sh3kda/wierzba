<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rysowanie SVG</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            font-family: Arial, sans-serif;
            background-color: #0f1117;
            color: #e8ecf3;
            text-align: center;
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Przykład Rysowania SVG</h1>
    <svg width="400" height="400">
        <rect x="0" y="0" width="400" height="400" fill="blue" stroke="black" stroke-width="4"/>
        <polygon points="0 400,200 0,400 400" fill="red" stroke="black" stroke-width="4"/>
    </svg>
</body>
</html>
